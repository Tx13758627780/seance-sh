[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "seance-sh"
version = "0.1.0"
description = "A haunted terminal: a local Gemma ghost whispers about every command you run. Fully offline."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "xt" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["cli", "shell", "ollama", "gemma", "halloween", "dia-de-los-muertos"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Shells",
]

[project.scripts]
seance = "seance.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
